<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courgette&family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="../src/cronometro.png" type="image/png">
    <title>Cronometro con JS</title>
  </head>
  <body>

    <h1 class="title">Cronometro Responsivo</h1>

    <main class="contenedor__principal">
      <div class="contenedor__interno">
        <div id="cronometro" class="cronometro"> 00:00:00 </div>
        <div class="button__container">
          <button id="boton__inicio-pausa" class="boton iniciar">
            <i class="bi bi-play-fill"></i>
          </button>
          <button id="reiniciar" class="boton">
            <i class="bi bi-arrow-counterclockwise"></i>
          </button>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
